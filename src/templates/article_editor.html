<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>{{ 'Edit story' if article else 'New story' }} | NewsFlow</title><link rel="stylesheet" href="{{ url_for('static', filename='newsflow.css') }}"></head>
<body><header class="masthead"><div class="masthead-inner"><a class="brand" href="/publisher"><span class="brand-kicker">Publisher workspace</span><span class="brand-name">NewsFlow</span><span class="brand-deck">Shape the story before it reaches the desk.</span></a><div class="masthead-meta">{{ current_user.display_name }}<br>Publisher</div></div></header>
<main class="page-shell editor-shell"><p class="eyebrow">Publisher / Story editor</p><h1>{{ 'Edit your story.' if article else 'Start with a story.' }}</h1>
{% if error %}<div id="message" class="message error" style="display:block" role="alert">{{ error }}</div>{% else %}<div id="message" class="message" role="status" style="display:none"></div>{% endif %}
<form id="submission-form" class="paper-panel editor-form" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
<label class="field" for="title"><span class="field-label">Headline</span><input id="title" name="title" value="{{ article.title if article else '' }}" placeholder="Council approves new metro line" required></label>
<label class="field" for="summary"><span class="field-label">Standfirst / summary</span><textarea id="summary" name="summary" rows="2" placeholder="A concise introduction for readers">{{ article.summary if article else '' }}</textarea></label>
<label class="field" for="category"><span class="field-label">Section</span><select id="category" name="category"><option {% if not article or article.category == 'General' %}selected{% endif %}>General</option><option {% if article and article.category == 'Local' %}selected{% endif %}>Local</option><option {% if article and article.category == 'Culture' %}selected{% endif %}>Culture</option><option {% if article and article.category == 'Business' %}selected{% endif %}>Business</option><option {% if article and article.category == 'World' %}selected{% endif %}>World</option></select></label>
<label class="field" for="cover_image"><span class="field-label">Cover image URL <span class="field-hint">(optional, http/https)</span></span><input id="cover_image" name="cover_image" type="url" value="{{ article.cover_image if article else '' }}" placeholder="https://example.com/image.jpg"></label>
<label class="field" for="author"><span class="field-label">Byline</span><input id="author" name="author" value="{{ current_user.display_name }}" required readonly></label>
<label class="field" for="content"><span class="field-label">Story</span><textarea id="content" name="content" rows="14" placeholder="Write the full story…" required>{{ article.content if article else '' }}</textarea></label>
<div class="editor-actions"><button class="secondary-button" type="submit" name="action" value="draft">Save draft</button><button class="secondary-button" type="submit" name="action" value="preview">Preview</button><button class="primary-button" type="submit" name="action" value="submit">Send to review</button></div>
</form></main><script src="{{ url_for('static', filename='article-editor.js') }}" defer></script></body></html>
