<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit News Article</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 20px; padding: 10px; display: none; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>Submit a News Article</h1>
    <a href="/reviewer">Go to Reviewer Dashboard</a>
    
    <form id="submission-form">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" required>
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="6" required></textarea>
        </div>
        <button type="submit">Submit Article</button>
    </form>

    <div id="message"></div>

    <script>
        document.getElementById('submission-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const content = document.getElementById('content').value;
            const msgBox = document.getElementById('message');

            try {
                const response = await fetch('/api/articles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, author, content })
                });

                const data = await response.json();

                msgBox.style.display = 'block';
                if (response.ok) {
                    msgBox.className = 'success';
                    msgBox.innerHTML = `Success! Article ID: ${data.id}, Status: ${data.status}`;
                    document.getElementById('submission-form').reset();
                } else {
                    msgBox.className = 'error';
                    msgBox.innerHTML = `Error: ${data.error}`;
                }
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.className = 'error';
                msgBox.innerHTML = `Request failed: ${err.message}`;
            }
        });
    </script>
</body>
</html>
